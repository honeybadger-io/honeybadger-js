name: Publish Release

# Single entry point for every publish path. All three modes live in this one file on
# purpose: NPM Trusted Publishing binds to a workflow *filename* and is configured
# per-package, so a fallback run from a separate workflow would mean flipping the trusted
# publisher on every package and flipping it back afterwards.
#
#   full (default) - run CI, then version + publish to NPM + CDN + create the GitHub release
#   npm            - re-publish the versions already committed to master (lerna from-package)
#   cdn            - re-upload the packages/js browser bundle to the CDN only
on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = version + NPM + CDN + GitHub release | npm = re-publish current versions | cdn = re-upload browser bundle only'
        type: choice
        default: full
        options:
          - full
          - npm
          - cdn

concurrency: ci-release

permissions:
  id-token: write # Required for OIDC / NPM Trusted Publishing
  contents: write
  pull-requests: write

jobs:
  ci:
    # `inputs` is empty on push, so a push to master takes the full release path
    if: ${{ (inputs.mode || 'full') == 'full' }}
    uses: ./.github/workflows/node.js.yml
    secrets: inherit

  publish:
    runs-on: ubuntu-latest
    needs: [ci]
    # Status functions are required here, otherwise this job is skipped along with `ci`
    # when `ci` does not run (npm/cdn modes).
    if: ${{ !failure() && !cancelled() }}
    env:
      MODE: ${{ inputs.mode || 'full' }}
      # Consumed by the @honeybadger-io/js `postpublish` hook (scripts/release-cdn.sh),
      # which runs under every mode that publishes.
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: "us-east-1"
      HONEYBADGER_JS_S3_BUCKET: ${{ secrets.HONEYBADGER_JS_S3_BUCKET }}
      HONEYBADGER_DISTRIBUTION_ID: ${{ secrets.HONEYBADGER_DISTRIBUTION_ID }}
      BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
    steps:
      # Only the `full` mode needs elevated write access (lerna pushes the version
      # commit + tags and creates the GitHub release). The fallback modes fall back to
      # the default token so an App-token problem can't also block recovery.
      - uses: actions/create-github-app-token@v2
        id: generate-token
        if: env.MODE == 'full'
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Git Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ steps.generate-token.outputs.token || github.token }}
          fetch-depth: 0
          ref: master

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'pnpm'

      # The root `prepare` script builds every package, which is what produces
      # packages/js/dist/browser for the CDN upload.
      - name: Install Deps
        run: pnpm install --frozen-lockfile

      - name: Git Config
        if: env.MODE == 'full'
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Publish Release
        if: env.MODE == 'full'
        run: pnpm run release
        env:
          # for lerna
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Publish to NPM
        if: env.MODE == 'npm'
        run: pnpm exec lerna publish from-package --yes --loglevel silly

      - name: Publish to CDN
        if: env.MODE == 'cdn'
        run: |
          cd packages/js
          pnpm run postpublish

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo ":white_check_mark: Publish successful (mode: \`$MODE\`)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo ":warning: Publish failed (mode: \`$MODE\`). Check the logs above." >> "$GITHUB_STEP_SUMMARY"
          fi
